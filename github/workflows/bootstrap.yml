name: Bootstrap Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project structure
        run: flutter create .

      - name: Commit generated Flutter files
        run: |
          git config user.name "NOVAPOS Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Bootstrap Flutter Android project" || echo "No changes to commit"
          git push
